<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivacyCheck — Website Privacy & Security Audit in Plain Language</title>
  <meta name="description" content="Check if any website protects your privacy and security. Plain language, no technical jargon, with built-in testing lab and software quality metrics.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7 5 13 12 15 7-2 12-8 12-15V7z' fill='%230f172a' stroke='%2338bdf8' stroke-width='1.5'/%3E%3Cpath d='m10 16 4 4 8-9' fill='none' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-layout">
  <!-- Sidebar Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a class="brand" href="#live" aria-label="PrivacyCheck Home">
        <div class="brand-icon">
          <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 2 4 7v8c0 7 5 13 12 15 7-2 12-8 12-15V7z" fill="url(#brandGrad)" stroke="#38bdf8" stroke-width="1.5"/>
            <path d="m10 16 4 4 8-9" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="brandGrad" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0f172a"/>
                <stop offset="1" stop-color="#1e293b"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">PrivacyCheck</span>
          <span class="brand-pill">v2.0 • Capstone</span>
        </div>
      </a>
    </div>

    <nav class="nav" aria-label="Main Navigation">
      <div class="nav-section-label">User Tools</div>
      <a href="#live" data-tab="live" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Check Website</span>
      </a>
      <a href="#compare" data-tab="compare" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span>Compare Sites</span>
        <span class="nav-tag new">New</span>
      </a>
      <a href="#guide" data-tab="guide" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>Privacy 101 Guide</span>
      </a>
      <a href="#history" data-tab="history" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Past Checks</span>
      </a>

      <div class="nav-section-label" style="margin-top:14px;">Software Testing Lab</div>
      <a href="#lab" data-tab="lab" class="nav-item lab-nav">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v7.31L4 18a2 2 0 0 0 1.69 3h12.62A2 2 0 0 0 20 18l-6-8.69V2h-4Z"/><path d="M8.5 2h7"/></svg>
        <div>
          <span>Testing Lab</span>
          <small class="nav-sub">Oracle & Regressions</small>
        </div>
      </a>
      <a href="#qa" data-tab="qa" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <div>
          <span>QA Engineering</span>
          <small class="nav-sub">ISO 25010 & Suite</small>
        </div>
      </a>
      <a href="#cases" data-tab="cases" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Test Case Rules</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="theme-switch-row">
        <span class="theme-label">Theme</span>
        <button id="theme-btn" class="theme-toggle" aria-label="Toggle dark/light mode">
          <svg class="theme-icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="theme-icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="security-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>SSRF-Safe Guard Active</span>
      </div>
    </div>
  </aside>

  <!-- Main Content Viewport -->
  <main id="main" class="main-viewport" tabindex="-1" aria-live="polite">
    <!-- Injected by app.js -->
  </main>
</div>

<!-- Floating Toast Notification -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
